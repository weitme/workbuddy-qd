name: WorkBuddy 每日自动签到

on:
  workflow_dispatch:
  schedule:
    - cron: '3 4 * * *'    # UTC 04:03 = 北京时间 12:03 首次签到
    - cron: '4 5 * * *'    # UTC 05:04 = 北京时间 13:04 复查补签

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行签到
        env:
          WORKBUDDY_ACCOUNTS: ${{ secrets.WORKBUDDY_ACCOUNTS }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python checkin.py
